     BOOTSTRAP JS
     ===================================================== -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     SPOTLIGHT
     ===================================================== -->
<script>

function applySmoothSpotlight(selector, spotlightClass) {

    document.querySelectorAll(selector).forEach(el => {

        if (spotlightClass) {
            el.classList.add(spotlightClass);
        }

        let targetX = el.offsetWidth / 2;
        let targetY = el.offsetHeight / 2;

        let currentX = targetX;
        let currentY = targetY;

        let rafId = null;


        function update() {

            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;

            el.style.setProperty('--x', `${currentX}px`);
            el.style.setProperty('--y', `${currentY}px`);

            rafId = requestAnimationFrame(update);
        }


        el.addEventListener('mousemove', e => {

            const rect = el.getBoundingClientRect();

            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;

            if (!rafId) {
                update();
            }

        });


        el.addEventListener('mouseleave', () => {

            targetX = el.offsetWidth / 2;
            targetY = el.offsetHeight / 2;

        });

    });

}


// Navigation buttons
applySmoothSpotlight(
    '.btn-group .btn',
    'spotlight-btn'
);


// Step indicators
applySmoothSpotlight(
    '.step .circle',
    'spotlight-step'
);


// Tiles
applySmoothSpotlight(
    '.project-theme-tile',
    'spotlight-tile'
);

const testMaterials = [
    {
        materialID: "1001",
        name: "Premium Example Material",
        supplier: "Example Supplier"
    },
    {
        materialID: "2002",
        name: "Standard Example Material",
        supplier: "Second Supplier"
    },
    {
        materialID: "3003",
        name: "Premium Alternate Material",
        supplier: "Example Supplier"
    },
    {
        materialID: "4104",
        name: "Example Construction Material",
        supplier: "Second Supplier"
    }
];

const materialSearch = document.querySelector("#materialSearch");
const materialSuggestions = document.querySelector("#materialSuggestions");

materialSearch.addEventListener("input", () => {

    const query = materialSearch.value.trim().toLowerCase();

    if (!query) {
        materialSuggestions.innerHTML = "";
        materialSuggestions.style.display = "none";
        return;
    }

    const matches = testMaterials.filter(material =>
        [
            material.materialID,
            material.name,
            material.supplier
        ].some(value =>
            String(value || "").toLowerCase().includes(query)
        )
    );

    if (!matches.length) {
        materialSuggestions.innerHTML = "";
        materialSuggestions.style.display = "none";
        return;
    }

    materialSuggestions.innerHTML = matches.map(material =>
        `<li class="list-group-item" data-id="${material.materialID}">
            ${material.name} (${material.materialID})
        </li>`
    ).join("");

    materialSuggestions.style.display = "block";
});

materialSuggestions.addEventListener("click", (e) => {

    const li = e.target.closest("li[data-id]");
    if (!li) return;

    const material = testMaterials.find(
        material => String(material.materialID) === String(li.dataset.id)
    );

    if (!material) return;

    materialSearch.value = material.name;

    materialSuggestions.innerHTML = "";
    materialSuggestions.style.display = "none";

});

document.addEventListener("click", (e) => {

    if (
        !materialSearch.contains(e.target) &&
        !materialSuggestions.contains(e.target)
    ) {
        materialSuggestions.style.display = "none";
    }

});

</script>
